  <line x1="0" y1="56" x2="800" y2="56" stroke="#172554"/>
  
  <rect x="24" y="18" width="20" height="20" rx="6" fill="#0068F5"/>
  <text x="52" y="32" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold">AuraStore Pro</text>
  
  <rect x="220" y="14" width="360" height="28" rx="8" fill="#011959" stroke="#172554"/>
  <text x="240" y="32" fill="#A7B2C5" font-family="sans-serif" font-size="11">Buscar catálogo de produtos inteligentes...</text>
  
  <circle cx="680" cy="28" r="14" fill="#011959"/>
