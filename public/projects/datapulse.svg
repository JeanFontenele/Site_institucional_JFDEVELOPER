<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#01113E"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#172554" stroke-width="2"/>
  
  <!-- App bar -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#010C2B"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#172554"/>
  <circle cx="25" cy="25" r="5" fill="#EF4444"/>
  <circle cx="41" cy="25" r="5" fill="#F59E0B"/>
  <circle cx="57" cy="25" r="5" fill="#10B981"/>
  
  <text x="90" y="30" fill="#10C4FC" font-family="sans-serif" font-size="13" font-weight="bold">DataPulse AI</text>
  <rect x="200" y="12" width="130" height="26" rx="6" fill="#011959"/>
  <text x="215" y="29" fill="#F1F5F9" font-family="sans-serif" font-size="11">● Treinamento Ativo</text>
  
  <rect x="630" y="12" width="140" height="26" rx="6" fill="#0068F5"/>
  <text x="646" y="29" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Executar Predição</text>

  <!-- Left Sidebar filters -->
  <rect x="0" y="50" width="200" height="450" fill="#010C2B"/>
  <line x1="200" y1="50" x2="200" y2="500" stroke="#172554"/>
  
  <g transform="translate(18, 70)">
    <text x="0" y="10" fill="#A7B2C5" font-family="sans-serif" font-size="11" font-weight="bold">MODELOS DE IA</text>
    
    <rect x="0" y="24" width="164" height="34" rx="6" fill="#011959" stroke="#0068F5"/>
    <text x="12" y="46" fill="#10C4FC" font-family="sans-serif" font-size="11">NLP Sentiment Pro</text>
    
    <rect x="0" y="68" width="164" height="34" rx="6" fill="#01113E"/>
    <text x="12" y="90" fill="#A7B2C5" font-family="sans-serif" font-size="11">Previsão Demanda v3</text>
    
    <rect x="0" y="112" width="164" height="34" rx="6" fill="#01113E"/>
    <text x="12" y="134" fill="#A7B2C5" font-family="sans-serif" font-size="11">Detecção Anomalias</text>
    
    <text x="0" y="180" fill="#A7B2C5" font-family="sans-serif" font-size="11" font-weight="bold">MÉTRICAS DO SISTEMA</text>
    <text x="0" y="205" fill="#F1F5F9" font-family="sans-serif" font-size="11">Latência de Inferência</text>
    <text x="0" y="222" fill="#10C4FC" font-family="sans-serif" font-size="14" font-weight="bold">18.4 ms</text>
    
    <text x="0" y="255" fill="#F1F5F9" font-family="sans-serif" font-size="11">Precisão F1-Score</text>
    <text x="0" y="272" fill="#10C4FC" font-family="sans-serif" font-size="14" font-weight="bold">98.7%</text>
  </g>

  <!-- Right Central Canvas / Graph -->
  <g transform="translate(220, 70)">
    <!-- Metrics tiles -->
    <rect width="270" height="90" rx="10" fill="#011959" stroke="#172554"/>
    <text x="16" y="30" fill="#A7B2C5" font-family="sans-serif" font-size="12">Requisições Analisadas (24h)</text>
    <text x="16" y="62" fill="#F1F5F9" font-family="sans-serif" font-size="24" font-weight="bold">4.289.120</text>

    <g transform="translate(286, 0)">
      <rect width="268" height="90" rx="10" fill="#011959" stroke="#172554"/>
      <text x="16" y="30" fill="#A7B2C5" font-family="sans-serif" font-size="12">Automações Disparadas</text>
      <text x="16" y="62" fill="#10C4FC" font-family="sans-serif" font-size="24" font-weight="bold">93.410</text>
    </g>

    <!-- Visual Neural Chart Area -->
    <g transform="translate(0, 110)">
      <rect width="554" height="295" rx="12" fill="#011959" stroke="#172554"/>
      <text x="20" y="30" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="600">Fluxo de Tomada de Decisão Autônoma</text>
      
      <!-- Network Nodes -->
      <line x1="80" y1="120" x2="200" y2="80" stroke="#0068F5" stroke-width="2"/>
      <line x1="80" y1="120" x2="200" y2="160" stroke="#0068F5" stroke-width="2"/>
      <line x1="80" y1="200" x2="200" y2="160" stroke="#0068F5" stroke-width="2"/>
      <line x1="80" y1="200" x2="200" y2="230" stroke="#0068F5" stroke-width="2"/>

      <line x1="200" y1="80" x2="340" y2="120" stroke="#10C4FC" stroke-width="2"/>
      <line x1="200" y1="160" x2="340" y2="120" stroke="#10C4FC" stroke-width="2"/>
      <line x1="200" y1="160" x2="340" y2="200" stroke="#10C4FC" stroke-width="2"/>
      <line x1="200" y1="230" x2="340" y2="200" stroke="#10C4FC" stroke-width="2"/>

      <line x1="340" y1="120" x2="470" y2="160" stroke="#10C4FC" stroke-width="3"/>
      <line x1="340" y1="200" x2="470" y2="160" stroke="#10C4FC" stroke-width="3"/>

      <!-- Input Layer Nodes -->
      <circle cx="80" cy="120" r="14" fill="#0032A7" stroke="#0068F5" stroke-width="2"/>
      <text x="74" y="124" fill="#F1F5F9" font-family="sans-serif" font-size="10">X1</text>

      <circle cx="80" cy="200" r="14" fill="#0032A7" stroke="#0068F5" stroke-width="2"/>
      <text x="74" y="204" fill="#F1F5F9" font-family="sans-serif" font-size="10">X2</text>

      <!-- Hidden Layer 1 -->
      <circle cx="200" cy="80" r="15" fill="#0068F5"/>
      <circle cx="200" cy="160" r="15" fill="#0068F5"/>
      <circle cx="200" cy="230" r="15" fill="#0068F5"/>

      <!-- Hidden Layer 2 -->
      <circle cx="340" cy="120" r="16" fill="#0068F5" stroke="#10C4FC" stroke-width="2"/>
      <circle cx="340" cy="200" r="16" fill="#0068F5" stroke="#10C4FC" stroke-width="2"/>

      <!-- Output Layer -->
      <circle cx="470" cy="160" r="22" fill="#10C4FC"/>
      <circle cx="470" cy="160" r="30" stroke="#10C4FC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4"/>
      <text x="458" y="164" fill="#010C2B" font-family="sans-serif" font-size="11" font-weight="bold">DECISÃO</text>
    </g>
  </g>
</svg>

