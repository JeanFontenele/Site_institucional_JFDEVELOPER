    <text x="12" y="16" fill="#10C4FC" font-family="sans-serif" font-size="11" font-weight="600">INOVAÇÃO CORPORATIVA</text>
    
    <text x="0" y="60" fill="#F1F5F9" font-family="sans-serif" font-size="28" font-weight="bold">Infraestrutura em Nuvem</text>
    <text x="0" y="95" fill="#F1F5F9" font-family="sans-serif" font-size="28" font-weight="bold">e Engenharia de Dados</text>
