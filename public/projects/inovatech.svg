  <text x="40" y="82" fill="#F1F5F9" font-family="sans-serif" font-size="16" font-weight="bold">INOVA<tspan fill="#10C4FC">TECH</tspan></text>
  
  <text x="440" y="81" fill="#A7B2C5" font-family="sans-serif" font-size="12">Soluções</text>
  <text x="520" y="81" fill="#A7B2C5" font-family="sans-serif" font-size="12">Sobre</text>
